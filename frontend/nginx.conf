server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 55m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Real-IP $remote_addr; }
 location /health { proxy_pass http://backend:8000; }
 location /ready { proxy_pass http://backend:8000; }
 location = /bim/worker.mjs { default_type text/javascript; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
