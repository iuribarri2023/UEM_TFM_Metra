# Optional local file mounts for Docker Desktop or Linux Compose.
services:
  catalogue-init:
    environment:
      METRA_ADMIN_PASSWORD_FILE: /run/secrets/metra_admin_password
    secrets:
      - metra_admin_password
secrets:
  metra_admin_password:
    file: ${METRA_ADMIN_SECRET_SOURCE:?Configura METRA_ADMIN_SECRET_SOURCE}
